services:
  db:
    image: postgres:16-alpine
    container_name: paygate_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-paygate_service}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paygate_app
    restart: unless-stopped
    env_file:
      - .env
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paygate_migrations
    env_file:
      - .env
    command: >
      sh -c "uv run alembic revision --autogenerate -m 'auto_migration' && 
             uv run alembic upgrade head"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: